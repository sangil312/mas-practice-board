server.port: 9000
spring.application.name: article-api
spring.profiles.active: local

snowflake:
  node-id: 1
  start-time-millis: 1704067200000

spring:
  datasource:
    hikari:
      auto-commit: false
  jpa:
    open-in-view: false
    properties.hibernate.default_batch_fetch_size: 100

server:
  tomcat:
    max-connections: 20000
    connection-timeout: 3s
    threads:
      max: 600
      min-spare: 100

---

spring.config.activate.on-profile: local

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/local-article-db?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        show_log: true
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/article.sql
  kafka:
    bootstrap-servers: 127.0.0.1:9092

springdoc:
  packages-to-scan: dev.article.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false

---

spring.config.activate.on-profile: local-test

spring:
  datasource:
    url: jdbc:h2:mem:local-db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        ddl-auto: create
        show_log: true
        format_sql: true

  sql.init.mode: never